# ============================================================
# Cloudflare Pages 部署配置 - BrainSphere 词条关系图
# ============================================================
# 本文件用于 Wrangler CLI 部署到 Cloudflare Pages
#
# 部署方式一（推荐）：Cloudflare Dashboard 拖放上传
#   1. 登录 https://dash.cloudflare.com
#   2. 左侧 Pages → 创建项目 → 直接上传
#   3. 将 deploy 目录打包为 .zip 拖放上传
#   4. 获得 *.pages.dev 域名，可绑定自定义域名
#
# 部署方式二：Wrangler CLI 命令行
#   1. 安装 Wrangler：npm install -g wrangler
#   2. 登录：wrangler login
#   3. 在 deploy 目录下执行：wrangler pages deploy .
#   4. 获得 *.pages.dev 域名
#
# ============================================================

name = "brainsphere"
compatibility_date = "2024-01-01"

# 无需构建，纯静态 HTML
# 部署目录下的所有文件都会上传到 Pages
